name: EDINET Fetcher

on:
  schedule:
    # 毎日12:00 JST (03:00 UTC) に実行
    - cron: '0 3 * * *'
  # 手動実行も可能にする
  workflow_dispatch:

# delisted_companies.yml の更新と commit が並行実行で競合しないよう直列化
concurrency:
  group: edinet-fetcher
  cancel-in-progress: false

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
    # リポジトリのコードをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # デフォルトのGITHUB_TOKENではなく、PAT(Personal Access Token)を使用
        token: ${{ secrets.GITHUB_TOKEN }}
    
    # Pythonのセットアップ（3.7以上）
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'  # 3.7以上の安定版を使用
    
    # uvのセットアップ
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: 'latest'
    
    # 依存関係のインストール
    - name: Install dependencies
      run: |
        make install
    
    # 1つ目のスクリプトを実行（環境変数を使用）
    - name: Fetch financial documents from EDINET
      env:
        EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      run: uv run python bin/fetch_edinet_financial_documents.py --date $(date -d "yesterday" '+%Y-%m-%d') --outputdir data/jsons --api-key $EDINET_API_KEY

    # JPX data_j.xls との差分で上場廃止銘柄を検出し delisted_companies.yml を更新
    # 失敗時は段階的エスカレーション（1→warning / 2→step summary / 3→exit 1）
    - name: Update delisted companies
      run: |
        uv run python bin/update_delisted_companies.py \
          --jsonsdir data/jsons \
          --mapping config/stock_exchange_mapping.yml \
          --output data/delisted_companies.yml

    # 2つ目のスクリプトを実行
    - name: Consolidate documents
      run: |
        uv run python bin/consolidate_documents.py \
          --inputdir data/jsons/ \
          --output data/edinet.json \
          --delisted data/delisted_companies.yml

    # Gitの設定
    - name: Configure Git
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
    
    # 生成されたファイルをコミット
    - name: Commit generated files
      run: |
        git add .
        git commit -m "Auto-generated files from daily script run - $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
    
    # mainブランチにプッシュ
    - name: Push changes
      run: |
        git push origin main
