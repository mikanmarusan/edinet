[project]
name = "edinet"
version = "0.1.0"
description = "EDINET financial documents fetcher and parser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "argparse",
    "python-xbrl>=1.1.1",
    "pandas>=2.0.0",
    "urllib3<2.0",
    "PyYAML>=6.0",
    "xlrd==1.2.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bin", "lib"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]
